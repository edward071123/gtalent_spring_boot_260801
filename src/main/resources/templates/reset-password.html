<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            display: grid;
            place-items: center;
            color: #1f2933;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #e3f8ee;
            color: #0b6b3a;
        }

        .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe3e3;
            color: #9b1c1c;
        }

        .link-row {
            margin-top: 16px;
            text-align: center;
        }

        a {
            color: #1769aa;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main>
    <h1>重設密碼</h1>
    <p id="message" class="message"></p>
    <p id="error" class="error" th:style="${tokenValid} ? '' : 'display: block;'"
       th:text="${tokenValid} ? '' : '重設密碼連結無效或已過期'"></p>

    <form id="resetPasswordForm" th:style="${tokenValid} ? '' : 'display: none;'">
        <label for="password">新密碼</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="12" required>

        <label for="confirmPassword">確認新密碼</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required>

        <button id="resetButton" type="button">重設密碼</button>
    </form>
    <div class="link-row">
        <a href="/page/login">回登入頁</a>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    $("#resetButton").on("click", function () {
        $("#message").hide();
        $("#error").hide();
        $("#resetButton").prop("disabled", true).text("重設中");

        const payload = {
            token: token,
            password: $("#password").val(),
            confirmPassword: $("#confirmPassword").val()
        };

        $.ajax({
            url: "/members/reset-password",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "密碼重設成功，請重新登入").show();
                $("#resetPasswordForm").hide();
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "重設失敗").show();
            },
            complete: function () {
                $("#resetButton").prop("disabled", false).text("重設密碼");
            }
        });
    });
</script>
</body>
</html>
