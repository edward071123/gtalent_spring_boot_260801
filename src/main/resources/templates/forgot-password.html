<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            display: grid;
            place-items: center;
            color: #1f2933;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #52606d;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #e3f8ee;
            color: #0b6b3a;
        }

        .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe3e3;
            color: #9b1c1c;
        }

        .link-row {
            margin-top: 16px;
            text-align: center;
        }

        a {
            color: #1769aa;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main>
    <h1>忘記密碼</h1>
    <p>輸入帳號或 email。若帳號存在，系統會寄送重設密碼連結。</p>
    <p id="message" class="message"></p>
    <p id="error" class="error"></p>

    <form id="forgotPasswordForm">
        <label for="accountOrEmail">帳號或 email</label>
        <input id="accountOrEmail" name="accountOrEmail" type="text" required>

        <button id="sendButton" type="button">寄送重設密碼信</button>
    </form>
    <div class="link-row">
        <a href="/page/login">回登入頁</a>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#sendButton").on("click", function () {
        $("#message").hide();
        $("#error").hide();
        $("#sendButton").prop("disabled", true).text("寄送中");

        const payload = {
            accountOrEmail: $("#accountOrEmail").val().trim()
        };

        $.ajax({
            url: "/members/forgot-password",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "若帳號存在，將寄送重設密碼信").show();
                $("#forgotPasswordForm")[0].reset();
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "寄送失敗").show();
            },
            complete: function () {
                $("#sendButton").prop("disabled", false).text("寄送重設密碼信");
            }
        });
    });
</script>
</body>
</html>
