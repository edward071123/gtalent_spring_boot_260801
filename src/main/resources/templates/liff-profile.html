<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="liffId" name="liff-id" content="" th:content="${liffId}">
    <title>LINE 個人資料</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f7f9;
            color: #202124;
            font-family: Arial, "Noto Sans TC", sans-serif;
        }
        main {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            text-align: center;
        }
        h1 { margin: 0 0 24px; font-size: 24px; }
        #loading { color: #667085; }
        #error {
            display: none;
            padding: 12px;
            border-radius: 8px;
            background: #fff0f0;
            color: #b42318;
            text-align: left;
        }
        #profile { display: none; }
        #picture {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            background: #e9ecef;
        }
        dl { margin: 24px 0; text-align: left; }
        .field { padding: 12px 0; border-bottom: 1px solid #eaecf0; }
        dt { margin-bottom: 5px; color: #667085; font-size: 13px; }
        dd { margin: 0; overflow-wrap: anywhere; }
        button {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #06c755;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <h1>LINE 個人資料</h1>
    <p id="loading">正在讀取 LINE 資料...</p>
    <p id="error"></p>

    <section id="profile">
        <img id="picture" alt="LINE 大頭貼">
        <dl>
            <div class="field">
                <dt>顯示名稱</dt>
                <dd id="displayName">—</dd>
            </div>
            <div class="field">
                <dt>User ID</dt>
                <dd id="userId">—</dd>
            </div>
            <div class="field">
                <dt>狀態訊息</dt>
                <dd id="statusMessage">—</dd>
            </div>
        </dl>
        <button id="logoutButton" type="button">登出 LINE</button>
    </section>
</main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const loadingElement = document.getElementById("loading");
    const errorElement = document.getElementById("error");
    const profileElement = document.getElementById("profile");

    function showError(message) {
        loadingElement.style.display = "none";
        profileElement.style.display = "none";
        errorElement.textContent = message;
        errorElement.style.display = "block";
    }

    async function initializeLiff() {
        const liffId = document.getElementById("liffId").content.trim();
        if (!liffId) {
            showError("尚未設定 LIFF_ID，請先在 .env 加入 LIFF_ID。");
            return;
        }

        try {
            await liff.init({ liffId, withLoginOnExternalBrowser: true });

            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: window.location.href });
                return;
            }

            const profile = await liff.getProfile();
            document.getElementById("displayName").textContent = profile.displayName || "—";
            document.getElementById("userId").textContent = profile.userId || "—";
            document.getElementById("statusMessage").textContent = profile.statusMessage || "—";

            const picture = document.getElementById("picture");
            if (profile.pictureUrl) {
                picture.src = profile.pictureUrl;
            } else {
                picture.style.display = "none";
            }

            loadingElement.style.display = "none";
            profileElement.style.display = "block";
        } catch (error) {
            console.error(error);
            showError("LIFF 初始化失敗：" + (error.message || "請稍後再試"));
        }
    }

    document.getElementById("logoutButton").addEventListener("click", function () {
        liff.logout();
        window.location.reload();
    });

    initializeLiff();
</script>
</body>
</html>
