<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            display: grid;
            place-items: center;
            color: #1f2933;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe3e3;
            color: #9b1c1c;
        }
    </style>
</head>
<body>
<main>
    <h1>會員登入</h1>
    <p id="error" class="error"></p>

    <form id="loginForm">
        <label for="account">帳號</label>
        <input id="account" name="account" type="text" required>

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" required>

        <button id="loginButton" type="submit">登入</button>
    </form>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#loginForm").on("submit", function (event) {
        event.preventDefault();
        $("#error").hide();
        $("#loginButton").prop("disabled", true).text("登入中");

        const payload = {
            account: $("#account").val().trim(),
            password: $("#password").val()
        };

        $.ajax({
            url: "/members/login",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                localStorage.setItem("accessToken", data.accessToken);
                localStorage.setItem("refreshToken", data.refreshToken);
                window.location.href = "/page/books";
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "登入失敗").show();
            },
            complete: function () {
                $("#loginButton").prop("disabled", false).text("登入");
            }
        });
    });
</script>
</body>
</html>
