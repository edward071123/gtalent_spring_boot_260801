<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            display: grid;
            place-items: center;
            color: #1f2933;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe3e3;
            color: #9b1c1c;
        }
        
        .link-row {
            margin-top: 16px;
            text-align: right;
        }
    </style>
</head>
<body>
<main>
    <h1>會員登入</h1>
    <p id="error" class="error"></p>

    <form id="loginForm">
        <label for="account">帳號</label>
        <input id="account" name="account" type="text" required>

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" required>

        <button id="loginButton" type="button">登入</button>
    </form>
    <div class="link-row">
        <a href="/page/forgot-password">忘記密碼？</a>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    // 監聽登入按鈕的 click 事件。
    // 初學者可以先理解成：「按鈕被點擊後，就執行下面這段登入流程」。
    $("#loginButton").on("click", function () {
        // 每次重新登入前，先把上一個錯誤訊息隱藏。
        $("#error").hide();

        // 登入請求送出後，先停用按鈕並改成「登入中」。
        // 這樣可以避免使用者連續點擊，造成重複送出登入請求。
        $("#loginButton").prop("disabled", true).text("登入中");

        // 組成要送給後端的登入資料。
        // account 使用 trim() 去掉前後空白，避免使用者不小心多打一個空格。
        const payload = {
            account: $("#account").val().trim(),
            password: $("#password").val()
        };

        // 使用 AJAX 呼叫登入 API。
        // contentType: "application/json" 代表這次送出的資料格式是 JSON。
        $.ajax({
            url: "/members/login",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                // 登入成功後，後端會回傳 access token 和 refresh token。
                // 把 token 存在 localStorage，之後進入書籍頁時才能帶著 token 呼叫 API。
                localStorage.setItem("accessToken", data.accessToken);
                localStorage.setItem("refreshToken", data.refreshToken);

                // 登入成功後導向書籍列表頁。
                window.location.href = "/page/books";
            },
            error: function (xhr) {
                // 登入失敗時，優先顯示後端回傳的錯誤訊息。
                // 如果後端沒有 message，就顯示預設的「登入失敗」。
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "登入失敗").show();
            },
            complete: function () {
                // complete 不管成功或失敗都會執行。
                // 如果登入失敗，按鈕會恢復可點擊；如果登入成功，頁面會跳轉到書籍列表。
                $("#loginButton").prop("disabled", false).text("登入");
            }
        });
    });
</script>
</body>
</html>
