# 吃.env的資料
spring.config.import=optional:file:.env[.properties]

# 設定db連線
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:${TEST_DB_PORT}/${TEST_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# 測試只需要建立 JavaMailSender Bean，不會實際寄信
spring.mail.host=localhost
spring.mail.port=1025

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS}
jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS}

# password reset
app.base-url=${APP_BASE_URL}
member.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES}

# newebpay
newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID}
newebpay.hash-key=${NEWEBPAY_HASH_KEY}
newebpay.hash-iv=${NEWEBPAY_HASH_IV}
newebpay.version=${NEWEBPAY_VERSION}
newebpay.gateway-url=${NEWEBPAY_GATEWAY_URL}
newebpay.notify-url=${NEWEBPAY_NOTIFY_URL}
newebpay.return-url=${NEWEBPAY_RETURN_URL}

# 啟用 Flyway , Spring Boot 啟動時會自動跑 migration
spring.flyway.enabled=true
# 指定 migration SQL 放在哪裡, migration 正式測試都是吃一樣檔案, 但是測試資料會另外放在test/resources/db/testdata
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
spring.flyway.baseline-on-migrate=true

# Hibernate 驗證
spring.jpa.hibernate.ddl-auto=validate
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true
# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true
